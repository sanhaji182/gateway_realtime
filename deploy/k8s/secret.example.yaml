# Secret contoh — JANGAN commit nilai asli. Buat dengan:
#   kubectl create secret generic gateway-secrets --from-literal=JWT_SECRET=$(openssl rand -hex 32)
# File ini hanya template referensi.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
type: Opaque
stringData:
  # Harus identik untuk backend & dashboard agar token JWT bisa saling divalidasi.
  JWT_SECRET: "ganti-dengan-string-acak-64-karakter"
