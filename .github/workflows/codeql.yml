# Analisis keamanan kode dengan CodeQL untuk JavaScript/TypeScript & Go.
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1" # mingguan (Senin 06:00 UTC)

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@v4
      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # Go memakai build manual karena modul berada di subfolder backend_go.
      - if: matrix.build-mode == 'manual'
        run: go build ./...
        working-directory: backend_go
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
