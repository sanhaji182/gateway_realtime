name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (TypeScript + Lint + Test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:socket
      - run: npm run build

  backend:
    name: Backend (Go Vet + Race Test + Build)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
      - run: go vet ./...
        working-directory: backend_go
      # -race mendeteksi data race; REDIS_TEST_URL mengaktifkan integration test fan-out.
      - run: go test -race ./...
        working-directory: backend_go
        env:
          REDIS_TEST_URL: redis://localhost:6379
      - run: go build -o gateway-server .
        working-directory: backend_go
